{id:'med1',category:'medicines',name:'Majoon Falasfa',price:1450,rating:4.8,image:'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=400',benefits:'اعصابی کمزوری، جسمانی تھکاوٹ، دماغی کمزوری اور قوت مدافعت کی بہتری کے لیے مفید۔ قوت باہ میں معاون۔',method:'روزانہ صبح شام ایک چائے کا چمچ نیم گرم دودھ کے ساتھ۔ معالج کے مشورہ سے استعمال کریں۔',warnings:'ذیابیطس، بلڈ پریشر کے مریض معالج سے مشورہ کریں۔ بچوں کی پہنچ سے دور رکھیں۔',desc:'روایتی یونانی نسخہ سے تیار'},
{id:'med2',category:'medicines',name:'Habbe Muqawwi Meda',price:850,rating:4.6,image:'https://images.unsplash.com/photo-1471864190281-a93a3070b6de?w=400',benefits:'معدہ کی کمزوری، بدہضمی، گیس، کھٹی ڈکاریں اور بھوک کی کمی کے لیے مفید۔',method:'ایک گولی صبح شام کھانے کے بعد پانی سے۔',warnings:'حاملہ خواتین اور بچے معالج سے مشورہ کریں۔',desc:'معدہ کی اصلاح'},
{id:'med3',category:'medicines',name:'Sharbat Faulad',price:650,rating:4.7,image:'https://images.unsplash.com/photo-1550572017-edd951b8633d?w=400',benefits:'خون کی کمی، کمزوری، چکر آنا اور تھکاوٹ میں معاون۔',method:'20 ملی لیٹر دن میں دو بار پانی میں ملا کر۔',warnings:'آئرن کی زیادتی والے افراد احتیاط کریں۔',desc:'خون کی کمی'},
{id:'mur1',category:'murabba',name:'Murabba Amla',price:750,rating:4.9,image:'https://images.unsplash.com/photo-1615485925600-97237c4fc1ec?w=400',benefits:'قوت مدافعت، بالوں کی صحت، نظر کی بہتری اور معدہ کے لیے بہترین۔ وٹامن سی سے بھرپور۔',method:'روزانہ صبح نہار منہ ایک سے دو دانے۔',warnings:'شوگر کے مریض کم مقدار میں استعمال کریں۔',desc:'خالص آملہ مربہ'},

{id:'arq2',category:'arqiyat',name:'Arq-e-Sounf',price:320,rating:4.7,image:'https://images.unsplash.com/photo-1511485977113-f34c92461ad9?w=400',benefits:'معدہ، گیس، بدہضمی، منہ کی بدبو اور بھوک کی کمی کے لیے مفید۔',method:'50 ملی لیٹر کھانے کے بعد دن میں دو بار۔',warnings:'کوئی خاص مضر اثر نہیں، اعتدال سے استعمال کریں۔',desc:'سونف کا خالص عرق'},
{id:'arq3',category:'arqiyat',name:'Arq-e-Makoh',price:380,rating:4.6,image:'https://images.unsplash.com/photo-1608571423902-eed4a94d8108?w=400',benefits:'جگر کی اصلاح، یرقان اور جگر کی گرمی میں معاون۔',method:'25 ملی لیٹر صبح شام پانی کے ساتھ۔',warnings:'جگر کے شدید امراض میں معالج سے مشورہ کریں۔',desc:'جگر کے لیے'}
];
let STORE=JSON.parse(localStorage.getItem('akhtar_v37_admin_fixed')||'null')||{products:PRODUCTS,hakeem:{name:'Hakeem Malik Muhammad Anwar Mutee Awan',qual:'B.U.M.S, F.T.J, Registered Tib Practitioner',exp:'30+ Years Experience in Unani & Herbal Medicine',bio:'حکیم ملک محمد انور متیع اعوان صاحب روایتی یونانی حکمت اور دیسی جڑی بوٹیوں کے ماہر ہیں۔ آپ کا مقصد خالص، معیاری اور مناسب قیمت پر علاج ہر گھر تک پہنچانا ہے۔ آپ 30 سال سے زائد عرصے سے حکمت کی خدمت میں مصروف ہیں۔',photo:'https://images.unsplash.com/photo-1612349317150-e413f6a5b16d?w=400',cert:'https://images.unsplash.com/photo-1589829085413-56de8ae18c73?w=600'},profiles:[],admin:{u:'',p:''}};
function save(){localStorage.setItem('akhtar_v37_admin_fixed',JSON.stringify(STORE))}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function init(){if(!STORE.admin.p){STORE.admin.u=await sha('hafiz3691');STORE.admin.p=await sha('zubair3691');save()}}init();
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3000)}
function card(p){return `<div class="card rounded-[22px] lg:rounded-[26px] p-4 lg:p-5 flex flex-col items-center justify-center mx-auto text-center shadow-sm"><img src="${p.image}" class="h-[200px] sm:h-[220px] lg:h-[260px] w-full object-cover rounded-[16px] lg:rounded-[20px] bg-[#fdf6e3] border-2 border-[#f3e8d0]"><h3 class="mt-4 lg:mt-5 font-black text-[17px] lg:text-[20px] text-[#3d1f0a] leading-tight">${p.name}</h3><div class="flex justify-center items-center gap-3 lg:gap-4 mt-3 lg:mt-4"><span class="font-black text-[#5D2F0F] text-[16px] lg:text-[19px]">Rs. ${p.price}</span><span class="text-[12px] lg:text-[13px] font-black bg-[#f5e6c8] px-3 lg:px-3.5 py-1.5 rounded-full border-2 border-[#C8A951]">★ ${p.rating}</span></div><div class="grid grid-cols-2 gap-3 lg:gap-4 mt-4 lg:mt-5 w-full"><button onclick="orderNow('${p.id}')" class="order-btn h-11 lg:h-12 rounded-full text-[13px] lg:text-[14px] shadow-md">Order Now</button><button onclick="router('details','${p.id}')" class="detail-btn h-11 lg:h-12 rounded-full text-[13px] lg:text-[14px]">Details</button></div></div>`}
function orderNow(id){const p=STORE.products.find(x=>x.id===id);const msg=`Assalam-o-Alaikum, I want to order:\nProduct: ${p.name}\nPrice: Rs. ${p.price}\nCategory: ${p.category}`;window.open(`https://wa.me/923013691794?text=${encodeURIComponent(msg)}`,'_blank')}
function renderHome(a){
const feat=[...STORE.products].slice(0,6);
a.innerHTML=`
<div class="w-full max-w-[1400px] mx-auto flex flex-col items-center">
<div class="w-full bg-gradient-to-br from-[#fffbeb] via-[#fef3c7] to-[#fde68a] border-[3px] border-[#C8A951]/40 rounded-[20px] lg:rounded-[28px] p-5 lg:p-10 flex flex-col lg:flex-row gap-6 items-center justify-center shadow-lg overflow-hidden">
<div class="flex-1 text-center max-w-[600px]">
<span class="inline-block text-[11px] font-black bg-white text-[#5D2F0F] px-4 py-1 rounded-full border-2 border-[#C8A951] shadow-sm">100% Pure Herbal</span>
<h2 class="urdu-head text-[26px] lg:text-[40px] font-black text-[#3d1f0a] mt-4">خالص حکمت،<br>بھروسہ مند علاج</h2>

</div>
`;
}

async function updCred(e){e.preventDefault();const fd=new FormData(e.target);const uh=await sha(fd.get('curU').trim());const ph=await sha(fd.get('curP').trim());const msgEl=document.getElementById('credMsg');if(uh!==STORE.admin.u||ph!==STORE.admin.p){msgEl.textContent='❌ Wrong current credentials';msgEl.className='text-[13px] font-black text-center mt-4 text-red-600';return}if(fd.get('newP')!==fd.get('confP')){msgEl.textContent='❌ Passwords do not match';msgEl.className='text-[13px] font-black text-center mt-4 text-red-600';return}STORE.admin.u=await sha(fd.get('newU').trim());STORE.admin.p=await sha(fd.get('newP').trim());save();msgEl.textContent='✅ Credentials Updated Successfully';msgEl.className='text-[13px] font-black text-center mt-4 text-green-600';toast('✅ Updated');e.target.reset();}
function openProd(cat,id=null){
const f=document.getElementById('prodForm');
if(!f) return;
f.classList.remove('hidden');
const p=id?STORE.products.find(x=>x.id===id):{name:'',price:'',rating:4.8,image:'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=400',benefits:'',method:'روزانہ استعمال کریں',warnings:'معالج سے مشورہ کریں',desc:''};
f.innerHTML=`
<form onsubmit="saveProd(event,'${cat}','${id||''}')" class="grid grid-cols-1 md:grid-cols-2 gap-3 text-left">
<input name="name" value="${p.name}" required placeholder="Product Name *" class="h-11 px-3 border-[2.5px] rounded-xl font-black text-[13px] md:col-span-2">
<input name="price" type="number" value="${p.price}" required placeholder="Price Rs *" class="h-11 px-3 border-[2.5px] rounded-xl font-black text-[13px]">
<input name="rating" type="number" step="0.1" value="${p.rating||4.8}" required placeholder="Rating *" class="h-11 px-3 border-[2.5px] rounded-xl font-black text-[13px]">
<input name="image" value="${p.image}" required placeholder="Image URL *" class="h-11 px-3 border-[2.5px] rounded-xl font-black text-[12px] md:col-span-2">
<textarea name="benefits" rows="2" placeholder="Benefits (Urdu) *" required class="px-3 py-2 border-[2.5px] rounded-xl urdu text-[13px] md:col-span-2">${p.benefits||''}</textarea>
<textarea name="method" rows="2" placeholder="Method *" required class="px-3 py-2 border-[2.5px] rounded-xl urdu text-[13px] md:col-span-2">${p.method||''}</textarea>
<textarea name="warnings" rows="2" placeholder="Warnings *" required class="px-3 py-2 border-[2.5px] rounded-xl urdu text-[13px] md:col-span-2">${p.warnings||''}</textarea>
<div class="flex gap-3 md:col-span-2 mt-2">
<button class="flex-1 h-11 rounded-full bg-[#5D2F0F] text-white font-black text-[13px]">${id?'Update':'Save'} Product</button>
<button type="button" onclick="document.getElementById('prodForm').classList.add('hidden')" class="flex-1 h-11 rounded-full bg-white border-[2.5px] font-black text-[13px]">Cancel</button>
</div>
</form>`;
f.scrollIntoView({behavior:'smooth',block:'center'});
}
function saveProd(e,cat,id){
e.preventDefault();
const fd=new FormData(e.target);
const obj={
id:id||cat+Date.now().toString(),
category:cat,
name:fd.get('name'),
price:Number(fd.get('price')),
rating:Number(fd.get('rating'))||4.8,
image:fd.get('image'),
benefits:fd.get('benefits'),
method:fd.get('method'),
warnings:fd.get('warnings'),
desc:fd.get('name')
};
if(id) STORE.products=STORE.products.map(x=>x.id===id?{...x,...obj}:x);
else STORE.products.push(obj);
save();
toast(id?'✅ Product Updated':'✅ Product Added');
document.getElementById('prodForm').classList.add('hidden');
showDash(cat);
}
function delProd(id){
if(!confirm('Delete this product?')) return;
STORE.products=STORE.products.filter(x=>x.id!==id);
save();
toast('🗑️ Deleted');
const currentTab = ['medicines','murabba','arqiyat'].find(t=>document.getElementById('btn-'+t)?.className.includes('bg-[#5D2F0F]')) || 'medicines';
showDash(currentTab);
}
function saveHakeem(e){
e.preventDefault();
const fd=new FormData(e.target);
STORE.hakeem.name=fd.get('name');
STORE.hakeem.qual=fd.get('qual');
STORE.hakeem.bio=fd.get('bio');
STORE.hakeem.photo=fd.get('photo');
STORE.hakeem.cert=fd.get('cert');
save();
toast('✅ Hakeem Profile Updated');
showDash('hakeem');
}
function delProfile(id){
STORE.profiles=STORE.profiles.filter(p=>p.id!==id);
save();
toast('🗑️ Profile Deleted');
showDash('profiles');
}
function doSearch(q){const dd=document.getElementById('sDrop');if(!q){dd.classList.add('hidden');return}const lower=q.toLowerCase();const matches=STORE.products.filter(p=>p.name.toLowerCase().includes(lower)).slice(0,6);if(!matches.length){dd.innerHTML=`<div class="p-3 text-xs font-black text-gray-500 text-center">No results</div>`;dd.classList.remove('hidden');return}dd.innerHTML=matches.map(m=>`<div onclick="router('details','${m.id}')" class="flex gap-2 p-2.5 hover:bg-[#fdf6e3] cursor-pointer border-b text-left"><img src="${m.image}" class="h-10 w-10 rounded-xl border object-cover"><div><p class="text-[13px] font-black">${m.name}</p><p class="text-[11px] font-black text-[#8a6d3b]">Rs.${m.price}</p></div></div>`).join('');dd.classList.remove('hidden')}
function router(route,param=null){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.nav===route));const app=document.getElementById('app');if(route==='home')renderHome(app);else if(route==='medicines')renderCat(app,'medicines','Medicines');else if(route==='murabba')renderCat(app,'murabba','Murabba Jaat');else if(route==='arqiyat')renderCat(app,'arqiyat','Arqiyat');else if(route==='hakeem')renderHakeem(app);else if(route==='about')renderAbout(app);else if(route==='profile')renderProfile(app);else if(route==='admin')renderLogin(app);else if(route==='dash')renderDash(app);else if(route==='details')renderDetails(app,param);document.getElementById('sDrop').classList.add('hidden');document.getElementById('mMenu').classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}
router('home');
</script>
</body>
</html>
